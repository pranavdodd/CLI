[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "student-agent"
version = "0.1.0"
description = "A permission-aware academic and coding assistant for the terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
sa = "student_agent.cli:app"
student-agent = "student_agent.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["student_agent"]
